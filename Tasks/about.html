<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }

      body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .container {
        width: 900px;
        height: 500px;
        border: 2px solid gray;
        background-color: blanchedalmond;
        border-radius: 20px;
      }

      .container img {
        width: 100px;
        height: 100px;
        border-radius: 50px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <img src="./Images/brand.jpg" alt="" />
    </div>
  </body>
</html>
