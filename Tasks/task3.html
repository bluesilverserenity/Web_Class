<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navigation Bar</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: Arial, sans-serif;
        background-color: #f4f7fb;
      }

      .navbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding: 16px 50px;
        background-color: #102a43;
      }

      .logo {
        color: white;
        font-size: 24px;
        font-weight: bold;
        text-decoration: none;
      }

      .nav-links {
        display: flex;
        gap: 24px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .nav-links a {
        color: white;
        text-decoration: none;
        font-size: 16px;
      }

      .nav-links a:hover {
        color: #7dd3fc;
      }

      /* .login {
        background-color: white;
        color: black;
      } */
    </style>
  </head>
  <body>
    <nav class="navbar" aria-label="Main navigation">
      <a class="logo" href="#home">WebClass</a>
      <ul class="nav-links">
        <li><a href="#home">Home</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#services">Services</a></li>
        <li><a href="#contact">Contact</a></li>
        <li><a class="login" href="./task2.html">Login</a></li>
      </ul>
    </nav>
  </body>
</html>
